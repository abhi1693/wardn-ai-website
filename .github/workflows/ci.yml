name: CI
on:
  pull_request: null
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: true
permissions:
  contents: read
jobs:
  verify:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@59178a1adfb1547da9ba94fdd46962c510b8eb1f
    with:
      checks: '["lint", "build"]'
      scripts: '{"lint": "lint", "build": "build"}'
      timeout-minutes: 20
      runs-on: ubuntu-latest
      node-version: '22'
    name: Lint and build
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@59178a1adfb1547da9ba94fdd46962c510b8eb1f
    with:
      manifest: .github/images.json
      publish: ${{ github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' }}
      version: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs:
      - verify
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
